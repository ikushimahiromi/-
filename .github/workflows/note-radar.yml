name: note-radar

# note.com から「24時間以内に売れた有料note」を集め、note-radar/data にコミットする。
# 公開は Netlify がコミットを拾って自動で行う。
on:
  schedule:
    - cron: "7 * * * *" # 毎時7分（UTC）。デフォルトブランチでのみ動く
  workflow_dispatch:
  push:
    branches: [claude/note-radar]
    paths:
      - "note-radar/scripts/**"
      - "note-radar/themes.json"
      - ".github/workflows/note-radar.yml"

permissions:
  contents: write

concurrency:
  group: note-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: note.com から有料noteを収集
        run: python note-radar/scripts/fetch_notes.py

      - name: データをコミット
        run: |
          git config user.name "note-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-radar/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "note-radar: データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
